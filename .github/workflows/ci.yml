name: CI

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:


jobs:

  install:
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure in one Python version or system does not cancel the others, so that all problems are seen at once
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
        run:
          # We need login shells (-l) for micromamba to work.
          shell: bash -leo pipefail {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare mamba installation
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          # setup correct python version (the backup suffix makes "sed -i" work on Linux, macOS and Windows alike)
          sed -i.bak -e "s/- python=.*/- python=$PYTHON_VERSION/g" environment.yml
          rm -f environment.yml.bak

      - name: mamba setup
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-downloads: true
          # the cleanup after the job fails with "ENOENT ... micromamba-shell"; it is not needed on GitHub runners
          post-cleanup: none

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - if: runner.os == 'macOS'
        name: Fix Python PATH on macOS
        # See https://github.com/actions/setup-python/issues/132 and
        # https://github.com/actions/setup-python/issues/132#issuecomment-779406058
        # Login shells on macOS prepend system paths, so we need to
        # prepend the python path from actions/setup-python.
        # Micromamba sets up ~/.bash_profile, where we need to set the path now.
        run: |
          tee -a ~/.bash_profile <<<'export PATH="$pythonLocation/bin:$PATH"'

      - name: Install dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python --version | grep "Python ${PYTHON_VERSION}"
          pip install -e .
          pip freeze

      - name: Import all modules
        # A quick check that the package and all its dependencies (photutils included) can be imported
        run: |
          python -c "import easyspec; from easyspec.cleaning import cleaning; from easyspec.extraction import extraction; from easyspec.analysis import analysis; from easyspec.photometry import photometry; print('easyspec imported')"
