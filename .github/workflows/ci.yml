name: CI

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:


jobs:

  install:
    runs-on: ${{ matrix.os }}
    # A job that hangs fails with a clear message after 30 minutes, instead of running for hours
    timeout-minutes: 30
    strategy:
      # A failure in one Python version or system does not cancel the others, so that all problems are seen at once
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
        # macOS only with one Python version: the macOS runners of GitHub are often busy (long queues or cancelled jobs), and the
        # differences between Python versions are already tested on Linux and Windows
        include:
          - os: macos-latest
            python-version: "3.12"

    defaults:
        run:
          shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install easyspec and its dependencies
        # The same installation as a user would do: pip reads the dependencies from pyproject.toml
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python --version | grep "Python ${PYTHON_VERSION}"
          python -m pip install --upgrade pip
          pip install -e .
          pip freeze

      - name: Import all modules
        # A quick check that the package and all its dependencies (photutils included) can be imported
        run: |
          python -c "import easyspec; from easyspec.cleaning import cleaning; from easyspec.extraction import extraction; from easyspec.analysis import analysis; from easyspec.photometry import photometry; print('easyspec imported')"
