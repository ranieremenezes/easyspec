name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - ranieremenezes
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Please be sure to detail the issue.
      placeholder: Tell us what you see!
      value: "A bug happened in the function XXX, for the following parameters: X1, X2, X3... I was expecting to find the result X, but I found Y!\nI am also attaching the error log."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: |
        List any relevant information about your environment, for example:
          - **OS**: Ubuntu 20.04
          - **easyspec**: vX.Y.Z
          - **emcee**: vX.Y.Z
          - **astropy**: vX.Y.Z
      value: |
          - OS:
          - Node:
          - npm:
      render: markdown
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
